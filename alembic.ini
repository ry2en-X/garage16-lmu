# Alembic config for the LMU Garage server.
#
# Usage:
#   New/empty dev DB:      alembic upgrade head
#   Existing dev DB that   alembic stamp head
#   already has all the
#   current tables (e.g.
#   Base.metadata.create_all()
#   already made them):
#
#   New migration after    alembic revision --autogenerate -m "add X"
#   changing server/models.py:
#
# The actual DB URL is NOT hardcoded here — see alembic/env.py, which reads
# it from server.config.settings (the same LMU_GARAGE_DB_URL env var the
# server itself uses), so migrations always target whatever DB the app is
# currently configured for.

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
