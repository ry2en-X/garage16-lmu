# Builds the friend-facing Windows client (installer + portable zip) in its two
# editions (V0.9.2):
#   standard  Garage16-Client-Setup.exe / Garage16-Portable.zip
#             the plain client — the analysis opens in the browser
#   analysis  Garage16-Client-Analysis-Setup.exe / Garage16-Analysis-Portable.zip
#             "Client + analysis app" — the analysis in its own window (WebView2)
# NOT verifiable from the project's dev sandbox (no Windows runner there) — the
# first real run on GitHub is its first real test; see docs/CLIENT_BUILD.md.
#
# The server address baked into the package defaults to https://garage16.de.
# To use a different one, set the repository VARIABLE  GARAGE16_SERVER_URL
# (Settings -> Secrets and variables -> Actions -> Variables).
#
# Trigger manually from the Actions tab (artifacts only), or push a tag like
# client-v0.9.2 — then a GitHub release with all four files is created, whose
# description explains which download is which.
name: build-client

on:
  workflow_dispatch:
  push:
    tags: ["client-v*"]

jobs:
  # V0.9.7: the release gate first (ci.yml) — no client is built from code that did not pass
  tests:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, analysis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build client (PyInstaller + installer)
        shell: pwsh
        run: .\packaging\build_windows.ps1 -Edition ${{ matrix.edition }} -ServerUrl "${{ vars.GARAGE16_SERVER_URL || 'https://garage16.de' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: garage16-client-windows-${{ matrix.edition }}
          path: |
            dist-installer/*.exe
            dist-installer/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create the GitHub release with both editions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la files
          cat > notes.md <<'NOTES'
          Choose ONE of the two downloads (Windows 10/11):

          | Download | What you get |
          |---|---|
          | **Garage16-Client-Setup.exe** | **Client** — records and uploads your laps. The analysis opens in your browser. |
          | **Garage16-Client-Analysis-Setup.exe** | **Client + analysis app** — the same, plus the analysis in its own window (no browser needed, always in sync with the server). Needs the Microsoft Edge WebView2 Runtime, which Windows 11 and updated Windows 10 already have. |

          Switching later: install the other one over the existing installation — your login and recorded laps stay.
          The `*-Portable.zip` files are the same apps without an installer (unzip, run Garage16.exe).

          From 1.0 on you connect the client with the **email and password of your Garage16 account** — no token to copy.
          Step-by-step guide: the "Setup guide" page of your Garage16 website (`#/setup`).
          NOTES
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --title "Garage16 client ${TAG#client-v}" --notes-file notes.md
